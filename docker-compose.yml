services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leadflow
      POSTGRES_USER: leadflow
      POSTGRES_PASSWORD: leadflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadflow -d leadflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      network: host
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://leadflow:leadflow@postgres:5432/leadflow}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      network: host
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://leadflow:leadflow@postgres:5432/leadflow}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-production}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8000:8000"
    volumes:
      - attachment_data:/app/data/attachments
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      network: host
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://leadflow:leadflow@postgres:5432/leadflow}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: ["python", "-m", "app.worker"]
    volumes:
      - attachment_data:/app/data/attachments
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  attachment_data:
